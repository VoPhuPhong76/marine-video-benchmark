    const demoState = {
      activeFilename: demoVideos[0].filename,
      activePanel: "attributes"
    };

    const demoElements = {
      video: document.getElementById("marine-demo-video"),
      title: document.getElementById("demo-video-title"),
      count: document.getElementById("demo-video-count"),
      videoTabs: document.getElementById("demo-video-tabs"),
      attributes: document.getElementById("demo-attributes"),
      qa: document.getElementById("demo-qa")
    };

    function getDemoLabel(index) {
      return "Demo " + (index + 1);
    }

    function renderVideoTabs() {
      demoElements.videoTabs.replaceChildren();

      demoVideos.forEach((video, index) => {
        const item = document.createElement("li");
        const link = document.createElement("a");
        const label = document.createElement("span");
        const isActive = video.filename === demoState.activeFilename;

        item.classList.toggle("is-active", isActive);
        link.href = "#interactive-demo";
        link.dataset.filename = video.filename;
        link.setAttribute("role", "tab");
        link.setAttribute("aria-controls", "marine-demo-video");
        link.setAttribute("aria-selected", String(isActive));
        label.textContent = getDemoLabel(index);

        link.append(label);
        link.addEventListener("click", (event) => {
          event.preventDefault();
          demoState.activeFilename = video.filename;
          renderDemo();
        });
        item.append(link);
        demoElements.videoTabs.append(item);
      });
    }

    function renderAttributes(attributes) {
      if (!Array.isArray(attributes) || attributes.length === 0) {
        const message = document.createElement("p");
        message.className = "notification is-light";
        message.textContent = "Attribute data is not available for this video.";
        demoElements.attributes.replaceChildren(message);
        return;
      }

      const list = document.createElement("ul");

      attributes.forEach((attribute) => {
        const item = document.createElement("li");
        const label = document.createElement("strong");

        label.textContent = attribute.label + ": ";
        item.append(label, attribute.value);
        list.append(item);
      });

      demoElements.attributes.replaceChildren(list);
    }

    function renderQa(qaPairs) {
      if (!Array.isArray(qaPairs) || qaPairs.length === 0) {
        const message = document.createElement("p");
        message.className = "notification is-light";
        message.textContent = "Question-and-answer data is not available for this video.";
        demoElements.qa.replaceChildren(message);
        return;
      }

      const list = document.createElement("ol");

      qaPairs.forEach((qa) => {
        const item = document.createElement("li");
        const question = document.createElement("p");
        const questionLabel = document.createElement("strong");
        const answer = document.createElement("p");
        const answerLabel = document.createElement("strong");

        item.classList.add("mb-5");
        questionLabel.textContent = "Question: ";
        question.append(questionLabel, qa.question);
        item.append(question);

        const qaOptions = Array.isArray(qa.options) ? qa.options : [];

        if (qaOptions.length) {
          const options = document.createElement("ul");

          qaOptions.forEach((option) => {
            const optionItem = document.createElement("li");
            optionItem.textContent = option.label + ". " + option.text;
            options.append(optionItem);
          });

          item.append(options);
        }

        answerLabel.textContent = "Answer: ";
        answer.append(answerLabel, qa.answer || "Not available.");
        item.append(answer);
        list.append(item);
      });

      demoElements.qa.replaceChildren(list);
    }

    function renderPanelTabs() {
      document.querySelectorAll("[data-panel-tab]").forEach((tab) => {
        const isActive = tab.dataset.panelTab === demoState.activePanel;
        tab.classList.toggle("is-active", isActive);
        tab.querySelector("a").setAttribute("aria-selected", String(isActive));
      });

      demoElements.attributes.classList.toggle("is-hidden", demoState.activePanel !== "attributes");
      demoElements.qa.classList.toggle("is-hidden", demoState.activePanel !== "qa");
    }

    function renderDemo() {
      let activeVideo = demoVideos.find((video) => video.filename === demoState.activeFilename);

      if (!activeVideo) {
        activeVideo = demoVideos[0];
        demoState.activeFilename = activeVideo.filename;
      }

      const activeVideoIndex = demoVideos.indexOf(activeVideo);
      const activeDemoLabel = getDemoLabel(activeVideoIndex);

      demoElements.video.src = "./Video_demo/" + activeVideo.filename;
      demoElements.video.setAttribute("aria-label", activeDemoLabel + " benchmark video");
      demoElements.video.load();
      demoElements.video.play().catch(() => {});
      demoElements.title.textContent = activeDemoLabel;
      demoElements.count.textContent = activeVideoIndex + 1 + " / " + demoVideos.length;

      renderVideoTabs();
      renderAttributes(activeVideo.attributes);
      renderQa(activeVideo.qa);
      renderPanelTabs();
    }

    document.querySelectorAll("[data-panel-tab]").forEach((tab) => {
      tab.querySelector("a").addEventListener("click", (event) => {
        event.preventDefault();
        demoState.activePanel = tab.dataset.panelTab;
        renderPanelTabs();
      });
    });

    renderDemo();
  </script>
